<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hey Gia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div id="intro" class="card">
      <h1 id="typing"></h1>
      <button id="openBtn">Next</button>
    </div>

    <div id="question" class="card hidden">
      <p>
        So… I’m not great at asking things the normal way 😅  
        <br><br>
        But I wanted to ask you something special…
      </p>
      <h2>Will you be my Valentine? 💖</h2>

      <div class="buttons">
        <button id="yesBtn">Yes 💕</button>
        <button id="noBtn">No 😅</button>
      </div>
    </div>

    <div id="success" class="card hidden">
      <h1>YAY!! 🥰</h1>
      <p>
        I was really hoping you’d say yes 💘  
        <br><br>
        Happy Valentine’s 💖
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
