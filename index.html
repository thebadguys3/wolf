<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hey Gia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- Intro Card -->
    <div id="intro" class="card">
      <h1 id="typing"></h1>
      <button id="openBtn">Next</button>
    </div>

    <!-- Middle Card -->
    <div id="middle" class="card hidden">
      <p id="middleText"></p>
      <button id="nextBtn">Click next →</button>
    </div>

    <!-- Suspense Card (New Card 2) -->
    <div id="suspense" class="card hidden">
      <p id="suspenseText"></p>
      <button id="suspenseNextBtn">Next →</button>
    </div>

    <!-- Reassurance Card -->
    <div id="reassure" class="card hidden">
      <p id="reassureText"></p>
      <button id="reassureNextBtn">Next →</button>
    </div>

       <<!-- Question Card -->
    <div id="question" class="card hidden">
      <div class="hearts hidden"></div>
    
      <p id="questionText"></p> <!-- Step 1 text -->
    
      <h2 id="valentineQuestion"></h2> <!-- Step 2 heading -->
    
      <p id="step3Text" class="hidden"></p> <!-- Step 3 text -->
    
      <div class="buttons">
        <button id="yesBtn">Yes 💕</button>
        <button id="noBtn">No 😅</button>
      </div>
    </div>
    


    <!-- Success Card -->
    <div id="success" class="card hidden">
      <h1>YAY!! 🥰</h1>
      <p id="successText"></p>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
