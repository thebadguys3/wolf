<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hey Gia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- Intro Card -->
    <div id="intro" class="card">
      <h1 id="typing"></h1>
      <button id="openBtn">Next</button>
    </div>

    <!-- Middle Card -->
    <div id="middle" class="card hidden">
      <p>
        I know this is wild 😅  
        <br><br>
        But hear me out for just a second…
      </p>
      <button id="nextBtn">Click next →</button>
    </div>

    <!-- Question Card -->
    <div id="question" class="card hidden">
      <div class="hearts hidden"></div>

      <p>
        I know this is a little silly 😅  
        <br><br>
        But I wanted to ask you in a way that’s very <em>me</em>…
      </p>

      <h2>Will you be my Valentine? 💖</h2>

      <div class="buttons">
        <button id="yesBtn">Yes 💕</button>
        <button id="noBtn">No 😅</button>
      </div>
